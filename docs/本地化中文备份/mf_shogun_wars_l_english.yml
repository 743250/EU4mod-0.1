l_english:
 cb_mf_shogunate_japan_campaign:0 "平定日本"
 cb_mf_shogunate_japan_campaign_desc:0 "幕府以统一日本秩序为名，对控制日本领土的外部国家发动战争。"
 CB_ALLOWED_cb_mf_shogunate_japan_campaign:0 "平定幕府体系外的日本领土"
 MF_SHOGUNATE_JAPAN_CAMPAIGN_WAR_NAME:0 "$ORDER$$FIRST$平定$SECOND_NAME$之战"


 cb_mf_return_daimyo_land:0 "要求归还大名领地"
 cb_mf_return_daimyo_land_desc:0 "这个大名拒绝归还战争中吞并的旧领。幕府将用武力执行先前的命令，恢复被吞并的大名国家。"
 CB_ALLOWED_cb_mf_return_daimyo_land:0 "迫使目标归还旧大名领地"
 MF_RETURN_DAIMYO_LAND_WAR_NAME:0 "要求归还大名领地"
 mf_return_daimyo_land_wg:0 "归还大名领地"
 mf_return_daimyo_land_wg_desc:0 "占领目标省份，迫使敌方归还旧大名领地。"
 cb_mf_partition_daimyo:0 "强制分割大名"
 cb_mf_partition_daimyo_desc:0 "这个大名拒绝执行幕府的分割命令。幕府将迫使其交出吞并领地，并恢复已经灭亡的大名国家。"
 CB_ALLOWED_cb_mf_partition_daimyo:0 "强制分割目标大名"
 mf_partition_daimyo_wg:0 "强制分割"
 mf_partition_daimyo_wg_desc:0 "占领敌方首都，迫使其交出吞并的旧大名领地。"
 MF_PARTITION_DAIMYO_WAR_NAME:0 "$ORDER$$FIRST$强制分割$SECOND_NAME$之战"
 po_mf_partition_daimyo:0 "强制分割"
 po_mf_partition_daimyo_desc:0 "[From.GetName]将交出部分吞并领地。在这些省份恢复的大名国家将加入幕府体系。"
 CB_ALLOWED_po_mf_partition_daimyo:0 "分割目标并恢复旧大名国家"
 PEACE_po_mf_partition_daimyo:0 "强制分割$GIVERS$"
 po_mf_return_shogunate_provinces_desc:0 "[From.GetName]持有的非法幕府领地将被统一处分。存在现存幕府体系核心国的省份归还对应国家，其余省份由幕府收回。"
 CB_ALLOWED_po_mf_return_shogunate_provinces:0 "处分全部非法幕府领地"
 PEACE_po_mf_return_shogunate_provinces:0 "归还$GIVERS$持有的幕府领地"
 cb_mf_enforce_executor_service:0 "强制任命执行国"
 cb_mf_enforce_executor_service_desc:0 "这个大名拒绝成为幕府执行国。将军将迫使其接受任命，并承担监督其他大名的责任。"
 CB_ALLOWED_cb_mf_enforce_executor_service:0 "强制目标接受执行国任命"
 mf_enforce_executor_position_wg:0 "强制任命执行国"
 mf_enforce_executor_position_wg_desc:0 "占领敌方首都，迫使其接受幕府执行国任命。"
 MF_EXECUTOR_DAIMYO_WAR_NAME:0 "$ORDER$$FIRST$任命$SECOND_NAME$之战"
 po_mf_enforce_executor_appointment:0 "强制任命执行国"
 po_mf_enforce_executor_appointment_desc:0 "[From.GetName]将成为谱代大名和幕府执行国，协助将军监督其他大名。"
 CB_ALLOWED_po_mf_enforce_executor_appointment:0 "强制目标接受执行国任命"
 PEACE_po_mf_enforce_executor_appointment:0 "任命$GIVERS$为执行国"
 cb_mf_shogunate_excommunication:0 "幕府绝罚"
 cb_mf_shogunate_excommunication_desc:0 "这个大名因多次拒绝幕府命令而受到绝罚。幕府可以发动战争，迫使其重新服从将军。"
 CB_ALLOWED_cb_mf_shogunate_excommunication:0 "迫使受绝罚的大名服从幕府"
 mf_shogunate_excommunication_wg:0 "强制服从"
 mf_shogunate_excommunication_wg_desc:0 "占领敌方首都，迫使受绝罚的大名重新服从幕府。"
 MF_SHOGUNATE_EXCOMMUNICATION_WAR_NAME:0 "$ORDER$$FIRST$绝罚$SECOND_NAME$之战"
 po_mf_enforce_shogunate_obedience:0 "强制服从幕府"
 po_mf_enforce_shogunate_obedience_desc:0 "[From.GetName]将重新服从幕府，解除绝罚，并降低本国及其家臣的独立倾向。"
 CB_ALLOWED_po_mf_enforce_shogunate_obedience:0 "强制目标服从幕府命令。"
 PEACE_po_mf_enforce_shogunate_obedience:0 "强制$GIVERS$服从幕府"
 cb_mf_xiayi_campaign:0 "虾夷征讨"
 cb_mf_xiayi_campaign_desc:0 "幕府已将这个国家指定为虾夷征讨目标。将军和各大名可以夺取其领土，或迫使其成为幕府大名。"
 CB_ALLOWED_cb_mf_xiayi_campaign:0 "征讨虾夷目标"
 MF_XIAYI_CAMPAIGN_WAR_NAME:0 "$ORDER$$FIRST$征讨$SECOND_NAME$之战"
 mf_xiayi_conquest_wg:0 "征服省份"
 mf_xiayi_conquest_wg_desc:0 "占领指定省份，为幕府体系夺取新的领地。"
 mf_xiayi_campaign_wg:0 "收服为大名"
 mf_xiayi_campaign_wg_desc:0 "占领敌方首都，迫使其成为将军直属大名。"
 po_mf_subjugate_xiayi_daimyo:0 "收服为大名"
 po_mf_subjugate_xiayi_daimyo_desc:0 "[From.GetName]将成为将军直属的大名。"
 CB_ALLOWED_po_mf_subjugate_xiayi_daimyo:0 "将虾夷目标收服为幕府大名"
 PEACE_po_mf_subjugate_xiayi_daimyo:0 "收服$GIVERS$为幕府大名"
 po_mf_subjugate_daimyo:0 "收为家臣"
 po_mf_subjugate_daimyo_desc:0 "[From.GetName]将成为[Root.GetName]的家臣。"
 CB_ALLOWED_po_mf_subjugate_daimyo:0 "收为家臣"
 PEACE_po_mf_subjugate_daimyo:0 "收为$TAKERS$的家臣"
 cb_mf_sengoku:0 "战国收服"
 cb_mf_sengoku_desc:0 "战国收服是大名之间争夺地方霸权的战争。胜利者可以收服战败大名及其家臣，扩大自己的家臣集团。"
 CB_ALLOWED_cb_mf_sengoku:0 "收服战败大名及其家臣"
 mf_sengoku_subjugation:0 "收服大名"
 mf_sengoku_subjugation_desc:0 "占领敌方首都，迫使战败大名及其家臣臣服于胜利者。"
