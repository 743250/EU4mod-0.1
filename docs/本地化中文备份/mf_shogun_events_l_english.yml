l_english:
 haixiao:0 "海啸波及地区"
 mozhiyingwuzheyihui:0 "影武者政争"
 zhuxiangzhigaige:0 "助乡制度"
 kaikenzuqing:0 "新田开发"
 fengraozhimengsui:0 "歉收"
 qianghuahaijin:0 "强化海禁"
 xingxingxiangrong:0 "商业繁荣"
 desc_haixiao:0 "巨浪席卷沿岸，摧毁了农田、渔村和港口。灾区需要很长时间才能恢复。"
 desc_mozhiyingwuzheyihui:0 "真假将军的传闻引发了御所内部的权力斗争。幕府的威信受到损害，但有能力的官员也得到更多施展空间。"
 desc_zhuxiangzhigaige:0 "幕府重新安排助乡和宿场承担的劳役。道路运输逐渐恢复，来往商旅也带来了更多收入。"
 desc_kaikenzuqing:0 "足轻和农民被组织起来开垦荒地。新农田增加了粮食产量，也有助于恢复战后人口。"
 desc_fengraozhimengsui:0 "灾害和囤积造成了严重歉收，工坊与庄园都难以维持正常生产。"
 desc_qianghuahaijin:0 "幕府加强对港口和沿海商路的检查。走私贸易受到压制，合法贸易则更容易受到政府控制。"
 desc_xingxingxiangrong:0 "城市、市场和沿海商路日益繁荣，货物与白银在全国各地不断流动。"
 bl_japan.1_name:0 "关东大地震"
 bl_japan.1_desc:0 "一场大地震袭击了关东。城市、道路和神社严重受损，幕府必须决定投入多少力量救济灾民并维持地方秩序。"
 bl_japan.1.a:0 "全力救济灾民"
 bl_japan.1.a.tt:0 "[Root.GetName]减少§R10.00§!点御统。"
 bl_japan.1.b:0 "只能依靠地方自行救灾"
 bl_japan.1.b.tt:0 "[Root.GetName]减少§R20.00§!点御统。"
 bl_japan.2_name:0 "[GetYear]海啸"
 bl_japan.2_desc:0 "海啸袭击了沿海地区，摧毁大量船只、渔村和港口。幕府必须尽快组织救灾与重建。"
 bl_japan.2.a:0 "立刻组织救灾"
 bl_japan.3_name:0 "将军御所的影武者"
 bl_japan.3_desc:0 "将军御所传出有关影武者的流言，幕府官员和各大名都开始怀疑将军的真实身份。这场政治危机必须尽快解决。"
 bl_japan.3.a:0 "清除参与阴谋的人"
 bl_japan.3.b:0 "继续维持现状"
 bl_japan.3.b.tt:0 "[Root.GetName]增加§G10.00§!点御统。"
 bl_japan.4_name:0 "助乡制改革案"
 bl_japan.4_desc:0 "参勤交代增加了宿场和沿途村庄的负担。商人和地方官员提出改革助乡制度，以改善道路运输并减轻地方劳役。"
 bl_japan.4.a:0 "推行这项改革。"
 bl_japan.4.b:0 "维持现行制度"
 bl_japan.5_name:0 "新田开垦议案"
 bl_japan.5_desc:0 "地方官员请求扩大新田开发。工程需要大量劳力和水利投入，但完成后可以显著增加粮食产量。"
 bl_japan.5.a:0 "批准新田开发"
 bl_japan.6_name:0 "严重歉收"
 bl_japan.6_desc:0 "灾害、囤积和地方冲突导致粮食产量远低于预期。农民和商人都在质疑幕府应对危机的能力。"
 bl_japan.6.a:0 "推行轮耕休养"
 bl_japan.7_name:0 "走私贸易网络"
 bl_japan.7_desc:0 "沿海诸藩和商人网络私下接触海外货物。幕府必须决定是强化海禁，还是默许黑市存在。"
 bl_japan.7.a:0 "强化海禁。"
 bl_japan.7.b:0 "默许黑市。"
 bl_japan.8_name:0 "浮世绘的流行"
 bl_japan.8_desc:0 "浮世绘和其他城市文化随着商业繁荣快速传播。商品经济正在改变传统社会，也为幕府带来新的管理问题。"
 bl_japan.8.a:0 "加强官方管理"
 bl_japan.8.b:0 "允许其自由发展"
 bl_japan.9_name:0 "天皇失去领地"
 bl_japan.9_desc:0 "原本代表天皇的国家已经失去全部领地。幕府必须在现有大名中指定新的天皇。"
 bl_japan.9.a:0 "指定新的天皇"


 mf_daimyo.12.t:0 "归还大名领地"
 mf_daimyo.12.d:0 "幕府已经作出裁决：这块被吞并的领地应当归还给原来的大名。"
 mf_daimyo.12.a:0 "执行幕府裁决"
