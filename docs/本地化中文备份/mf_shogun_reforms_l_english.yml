 huobitongyi_2:0 "谱代中枢"
 desc_huobitongyi_2:0 "谱代大名协助将军处理政务，使幕府的命令能够更有效地传达到地方。"
 wujiazhufa:0 "武家诸法"
 desc_wujiazhufa:0 "武家诸法规定了大名的战争、分封和从属关系，是各大名共同遵守的幕府法令。"
 jiujizhengshi_1:0 "参勤交代"
 desc_jiujizhengshi_1:0 "大名需要定期前往幕府参勤，长途旅行、随行队伍和两地生活都给藩国财政带来沉重负担。"
 jiujizhengshi_2:0 "参勤交代"
 desc_jiujizhengshi_2:0 "各大名定期前往幕府参勤，将军得以监督地方领主，并展示幕府对全国的控制。"
 mf_ezo_campaign_preparation:0 "征讨虾夷"
 desc_mf_ezo_campaign_preparation:0 "长期准备北方征讨，使幕府军队积累了适应寒冷边境作战的经验。"
 gongyicaiduan:0 "公仪裁断"
 desc_gongyicaiduan:0 "幕府负责处理大名之间的争端，使将军的裁决成为各方都必须遵守的规则。"
 guotiling:0 "国替令"
 desc_guotiling:0 "幕府可以转封大名并重新安排领地，防止强大的地方势力长期控制同一地区。"
 zhufanjiancha:0 "诸藩监察"
 desc_zhufanjiancha:0 "目付、巡见使和执行国共同监督各地大名，使幕府能够更早发现违令、私战和非法兼并。"
