 Getjiangjun_trigger.a.tt:0 "§R只有天皇或征夷大将军可以推行维新。§!"
 shogun_weixin_gunlun.tt:0 "§O点击箭头切换改革页面。§!"
 mf_weixin_common_requirements_tt:0 "§Y维新改革§!\n幕府拥有至少§Y80§!御统时可以推行改革。每项改革花费§Y70§!御统。"
 mf_weixin_not_completed_tt:0 "该项维新尚未完成。"
 mf_weixin_authority_requirement_tt:0 "幕府至少拥有§Y80§!御统。完成改革将花费§Y70§!御统。"
 mf_weixin_current_shogun_tt:0 "由征夷大将军推行这项改革。"
 mf_weixin_peace_requirement_tt:0 "幕府当前处于和平。"
 shogun_weixin.b.a.tt:0 "所有直属属国独立倾向低于§Y50%§!。"
 shogun_weixin.e.k.tt:0 "至少两名直属大名对将军的好感达到§Y150§!。"
 shogun_weixin.i.k.tt:0 "除北海道外，日本地区皆由幕府掌控。"
 mf_weixin_j_prerequisites_tt:0 "已完成前六项维新：§Y禁中并公、身份统制、幕领检地、谱代大名、征讨虾夷、参勤交代§!。"
 shogun_weixin.k.k.tt:0 "已完成§Y公仪裁断§!。"
 shogun_weixin.l.k.tt:0 "已完成§Y国替令§!，且至少任命过一个§Y幕府执行国§!。"
 mf_weixin_f_prerequisites_tt:0 "已完成前九项维新，包括§Y公仪裁断、国替令、诸藩监察§!。"
 mf_weixin_g_prerequisites_tt:0 "已完成§Y武家诸法§!。"
 mf_weixin_b_effect_tt:0 "§Y解锁：§!决议§Y登记幕府领地§!和外交行动§Y要求归还幕府领地§!。幕府可以登记自己与直属大名控制的领地，并要求其他国家归还这些省份。"
 mf_weixin_c_effect_tt:0 "§Y解锁：§!外交行动§Y转为直属大名§!。幕府可以把大名控制的非法属国改为将军直属大名，每次行动获得§G2§!御统。"
 mf_weixin_d_effect_tt:0 "§Y解锁：§!外交行动§Y绝罚大名§!。幕府可以绝罚拒绝命令的大名，并获得相应的战争理由。成功绝罚大名获得§G2§!御统。"
 mf_weixin_e_effect_tt:0 "§Y解锁：§!外交行动§Y指定谱代大名§!。幕府最初可以任命§Y3§!名谱代大名；每名直属谱代大名每月提供§G+0.02§!御统。"
 mf_weixin_e_all_daimyos_tt:0 "所有幕府直属大名获得§Y谱代中枢§!：\n陆军规模上限：§G+5%§!\n独立倾向：§G-5%§!"
 mf_weixin_i_effect_tt:0 "§Y解锁：§!外交行动§Y狩野虾夷§!。幕府可以把拥有北海道省份并与幕府体系接壤的国家指定为虾夷征讨目标。与虾夷交战时，幕府每月获得§G+0.02§!御统。"
 mf_weixin_h_all_daimyos_tt:0 "所有幕府体系大名获得§Y参勤交代§!：\n每月自治度变化：§R+0.25%§!"
 shogun_weixin.k.a.tt:0 "§Y任命执行国§!所需的御统降低为§Y10§!。"
 mf_weixin_f_effect_tt:0 "§Y武家诸法§!禁止幕府体系内的大名互相发动战争。大名仍可对外征战，也可对宗主发动独立战争。"
 mf_weixin_f_all_daimyos_tt:0 "所有幕府直属大名获得§Y武家诸法§!：\n独立倾向：§G-5%§!\n幕府外交接受度：§G+10§!\n允许使用§Y转移属国§!和平条款"
 mf_weixin_g_effect_tt:0 "§Y狩野虾夷§!现在可以指定任何与幕府体系接壤的外部国家。"
 mulingjiandi:0 "幕领检地"
