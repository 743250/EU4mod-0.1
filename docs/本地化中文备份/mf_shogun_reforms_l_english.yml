 jinzhongbinggong:0 "禁中并公"
 desc_jinzhongbinggong:0 "幕府规范朝廷的礼仪与任官制度，在武家政权和朝廷之间建立稳定联系。"
 huobitongyi_1:0 "谱代中枢"
