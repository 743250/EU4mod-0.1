 mf_transfer_illegal_subject_desc:0 "幕府将要求[From.GetName]的当前宗主放弃家内统属。原宗主同意后，[From.GetName]才会成为将军直属大名；原宗主和其他幕府大名都会因幕府干预家内秩序而降低对幕府的好感。"
