 xuanxiafengxing_tooltip:0 "指定[From.GetName]为天皇。"
 xuanxiafengxing_desc:0 "幕府将承认[From.GetName]为天皇，使其代表朝廷与日本的传统秩序。指定天皇花费§Y10§!御统，之后§Y10§!年内不能再次指定。"
 xuanxiafengxing.a.tt:0 "未来§Y10§!年内不能重新指定天皇。"
 mf_xuanxiafengxing_authority_tt:0 "幕府至少需要§Y10§!点御统。"
 mf_xuanxiafengxing_cooldown_tt:0 "距离上次宣下奉行已经过去§Y10§!年。"
 shouyexiayi:0 "狩野虾夷"
 shouyexiayi_title:0 "狩野虾夷"
 shouyexiayi_tooltip:0 "将[From.GetName]指定为虾夷征讨目标。"
 shouyexiayi_desc:0 "将[From.GetName]指定为虾夷，号召幕府体系共同对其发动征讨。与虾夷交战时获得§Y10%§!陆军士气与§Y10%§!人力恢复速度；占领虾夷省份时有§Y20%§!概率获得核心。"
 shouyexiayi.a.tt:0 "指定后§Y10§!年内不能更换虾夷目标。"
