 mf_shouyexiayi_neighbor_tt:0 "目标必须邻接至少一个幕府体系国家。"
 mf_convert_daimyo:0 "指定谱代大名"
 mf_convert_daimyo_title:0 "指定谱代大名"
 mf_convert_daimyo_desc:0 "将[From.GetName]任命为谱代大名。谱代大名受到将军信任，可以参与幕府政务，但也需要承担更多军役。"
 mf_convert_daimyo_tooltip:0 "将该大名指定为谱代大名。"
 mf_convert_daimyo_small_daimyo_tt:0 "目标大名的发展度低于§Y100§!，且拥有少于§Y5§!座城市。"
 mf_convert_daimyo_limit_tt:0 "幕府当前拥有的谱代大名少于§Y3§!名；完成任务§Y谱代中枢§!后上限提高到§Y5§!名。"
 mf_fudai_refuses_shogunate:0 "拒绝接受幕府任命"
 mf_lecture_daimyo:0 "训诫大名"
 mf_lecture_daimyo_title:0 "训诫大名"
 mf_lecture_daimyo_tooltip:0 "公开训诫该大名。"
 mf_lecture_daimyo_desc:0 "幕府将公开训诫[From.GetName]，损害其威望并增加国内不稳。行动花费§Y5§!御统；完成§Y稳定社会秩序§!后花费降低为§Y3§!御统。"
 mf_lecture_daimyo_cooldown_tt:0 "该大名距离上次受训诫已经过去§Y5§!年。"
 mf_bestow_shogunate_grace:0 "赦免大名"
 mf_bestow_shogunate_grace_title:0 "赦免大名"
 mf_bestow_shogunate_grace_tooltip:0 "赦免该大名，并恢复其与幕府的关系。"
 mf_bestow_shogunate_grace_desc:0 "幕府将赦免[From.GetName]过去的过错，以改善双方关系并降低其独立倾向。行动花费§Y5§!御统；完成§Y稳定社会秩序§!后花费降低为§Y3§!御统。"
 mf_enforce_daimyo_peace:0 "强制和平"
 mf_enforce_daimyo_peace_title:0 "强制和平"
 mf_enforce_daimyo_peace_tooltip:0 "要求该大名停止对幕府体系内其他大名的进攻。"
 mf_enforce_daimyo_peace_desc:0 "要求[From.GetName]停止进攻其他幕府大名。对方接受时，幕府花费§Y10§!御统；完成§Y制止大名战争§!后降低为§Y5§!御统。对方拒绝时，将军将加入防御方作战。"
 mf_enforce_daimyo_peace_target_tt:0 "目标必须正在作为进攻方攻击另一个幕府直属大名。"
 mf_return_daimyo_land:0 "要求归还领地"
 mf_return_daimyo_land_title:0 "要求归还领地"
 mf_return_daimyo_land_desc:0 "要求[From.GetName]归还战争中吞并的旧大名领地。对方接受时，幕府获得§G2§!御统；完成§Y恢复旧家秩序§!后提高为§G5§!御统。对方拒绝时，相关省份将被视为非法领地，幕府也将获得战争理由。"
 mf_return_daimyo_land_tooltip:0 "要求扩张过度的大名归还被吞并的领地。"
 mf_return_daimyo_land_has_land_tt:0 "目标大名拥有至少一个仍有已灭亡旧家核心的省份。"
 mf_return_daimyo_land_high_authority:0 "幕府统御极高"
 mf_return_daimyo_land_good_authority:0 "幕府统御较高"
 mf_return_daimyo_land_weak_authority:0 "幕府统御不足"
 mf_return_daimyo_land_dominant_shogun:0 "幕府军力压倒目标"
 mf_return_daimyo_land_stronger_shogun:0 "幕府军力强于目标"
 mf_return_daimyo_land_strong_daimyo:0 "目标大名军力强盛"
 mf_return_daimyo_land_dominant_daimyo:0 "目标大名军力压倒幕府"
 mf_return_daimyo_land_recent_return:0 "最近已经归还过领地"
 mf_release_daimyo_from_shogun_land_title:0 "重新分封大名"
 mf_release_daimyo_from_shogun_land_desc:0 "在将军控制的旧领上恢复一个已经灭亡的大名国家，并使其成为幕府直属大名。"
 mf_release_daimyo_from_shogun_land_tooltip:0 "恢复一个已经灭亡的大名国家。"
 mf_release_daimyo_shogun_value_tt:0 "恢复一个已经灭亡的大名国家，幕府获得§G2§!御统。"
 mf_release_retainer_daimyo_from_land_title:0 "分封旧家"
 mf_release_retainer_daimyo_from_land_desc:0 "在自己的领地上恢复一个已经灭亡的大名国家，并使其成为家臣。新国家会继承宗主已经采用的政府改革。"
 mf_release_retainer_daimyo_from_land_tooltip:0 "恢复一个已经灭亡的大名国家，并使其成为我们的属国。"
 mf_demand_partition_daimyo:0 "强制分割"
 mf_demand_partition_daimyo_title:0 "强制分割"
 mf_demand_partition_daimyo_tooltip:0 "要求该大名恢复被其吞并的旧大名国家。"
 mf_demand_partition_daimyo_desc:0 "要求[From.GetName]交出部分吞并领地，并在这些省份恢复已经灭亡的大名国家。对方接受时花费§Y15§!御统；对方拒绝时花费§Y25§!御统，并给予幕府强制分割战争理由。"
 mf_demand_partition_daimyo_land_tt:0 "目标至少持有§Y3§!个非首都、且仍有已灭亡旧家核心的省份。"
 mf_appoint_executor_daimyo:0 "任命执行国"
 mf_appoint_executor_daimyo_title:0 "任命执行国"
 mf_appoint_executor_daimyo_tooltip:0 "任命该大名为执行国。"
 mf_appoint_executor_daimyo_desc:0 "将[From.GetName]任命为谱代大名和幕府执行国，使其协助监督其他大名并执行幕府命令。任命花费§Y20§!御统；完成§Y国替令§!后降低为§Y10§!御统。对方拒绝时，幕府将获得强制任命战争理由。"
 mf_appoint_executor_daimyo_size_tt:0 "目标发展度必须低于§Y300§!。"
 mf_excommunicate_daimyo:0 "绝罚大名"
 mf_excommunicate_daimyo_title:0 "绝罚大名"
 mf_excommunicate_daimyo_tooltip:0 "绝罚拒绝幕府命令的大名。"
 mf_excommunicate_daimyo_desc:0 "借助朝廷的名义绝罚[From.GetName]。绝罚持续十年，将严重损害该国的威望、外交声誉和国内稳定，并给予幕府相应的战争理由。"
 mf_excommunicate_daimyo_court_tt:0 "幕府必须已设立天皇目标。"
 mf_excommunicate_daimyo_refusal_tt:0 "目标必须拒绝过至少一项幕府命令。"
 mf_excommunicate_daimyo_active_tt:0 "目标当前未受到幕府绝罚。"
