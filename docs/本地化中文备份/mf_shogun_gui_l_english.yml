l_english:
 shogun_tianhuang.tt:0 "天皇是日本名义上的最高统治者，也是幕府统治合法性的重要来源。控制天皇所在的领地，可以加强幕府对全国的影响。"
 shogun_zhengyidajiangjun.tt:0 "征夷大将军是幕府的统治者。将军以京都为中心统领各地大名，并通过幕府法令维持日本秩序。"
 shogun_xiayi.tt:0 "虾夷是幕府指定的共同敌人。将军和大名可以对其发动征讨，将各家的军力用于对外扩张。"
 shogun_gui_dip_icon.tt:0 "可用幕府外交行动：\n§Y狩野虾夷§![1020.Getshogun_jinzhongbingong_dip]"
 Getshogun_jinzhongbingong_dip.tt:0 "\n§Y宣下奉行§!"
 enable_shogun_gui.tt:0 "幕府\n快捷键：§YF13§!"
