l_english:
 daimyo_vassal:0 "外样大名"
 daimyo_vassal_title:0 "外样大名"
 daimyo_vassal_title_plural:0 "外样大名"
 daimyo_vassal_is_our:0 "§Y$NAME$§!是我们的外样大名。"
 daimyo_vassal_long_desc:0 "外样大名是直接臣属于将军的地方领主。他们保有自己的领地和军队，可以与其他大名争夺势力，但必须参加幕府的战争并服从将军的统治。"
 mf_daimyo_vassal:0 "谱代大名"
 mf_daimyo_vassal_title:0 "谱代大名"
 mf_daimyo_vassal_title_plural:0 "谱代大名"
 mf_daimyo_vassal_is_our:0 "§Y$NAME$§!是我们的谱代大名。"
 mf_daimyo_vassal_long_desc:0 "谱代大名是受到将军信任的直属大名。他们参与幕府政务，承担更多军役，也比外样大名更受将军约束。"
 mf_daimyo:0 "谱代大名"
 mf_daimyo_desc:0 "谱代大名是受到将军信任的直属大名。他们参与幕府政务，并承担维持幕府统治的责任。"
 mf_retainer_daimyo:0 "家臣大名"
 mf_retainer_daimyo_desc:0 "家臣大名臣属于另一位大名。他们保有自己的领地，以贡赋和军役换取宗主保护，并随宗主参加战争。"
 mf_retainer_daimyo_vassal:0 "家臣"
 mf_retainer_daimyo_vassal_title:0 "家臣"
 mf_retainer_daimyo_vassal_title_plural:0 "家臣"
 mf_retainer_daimyo_vassal_is_our:0 "§Y$NAME$§!是我们的家臣。"
 mf_retainer_daimyo_vassal_long_desc:0 "家臣是在战国战争或分封中臣属于其他大名的地方领主。他们保有自己的领地，以贡赋和军役换取宗主保护，并随宗主参加战争。"
 mf_shogunate_diplomatic_acceptance:0 "幕府外交接受度"
 mf_shogunate_order_authority_5_tt:0 "幕府至少需要§Y5§!点御统。"
 mf_shogunate_order_authority_10_tt:0 "幕府至少需要§Y10§!点御统。"
 mf_shogunate_order_authority_20_tt:0 "幕府至少需要§Y20§!点御统。"
 mf_shogunate_order_authority_25_tt:0 "幕府至少需要§Y25§!点御统。"
 mf_shogunate_order_target_development:0 "目标大名规模"
 mf_shogun_cannot_annex_subjects_tt:0 "大名是幕府统治下的地方领主。将军可以通过幕府属国互动调整他们的领地。"
