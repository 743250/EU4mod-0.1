l_english:
 mf_shogun_missions_authority_title:0 "幕府权威"
 mf_shogun_missions_authority_desc:0 "稳定国内局势，整顿社会秩序，并加强幕府对各大名的控制。"
 mf_shogun_missions_court_title:0 "朝廷权威"
 mf_shogun_missions_court_desc:0 "恢复幕府与朝廷的联系，使将军的统治获得更广泛的认可。"
 mf_shogun_missions_law_title:0 "幕府法令"
 mf_shogun_missions_law_desc:0 "通过参勤交代、武家诸法和执行国制度管理各地大名。"
 mf_shogun_missions_domains_title:0 "领地监察"
 mf_shogun_missions_domains_desc:0 "登记各地领土，恢复被吞并的大名国家，并建立谱代与地方监察制度。"
 mf_shogun_missions_learning_title:0 "对外扩张"
 mf_shogun_missions_learning_desc:0 "稳定日本之后，幕府可以组织各大名共同向海外扩张。"
 mf_shogun_requires_identity_control_tt:0 "需要完成维新改革§Y身份统制§!。"
 mf_shogun_requires_court_channel_reform_tt:0 "需要完成维新改革§Y禁中并公§!。"
 mf_shogun_requires_buke_law_reform_tt:0 "需要完成维新改革§Y武家诸法§!。"
 mf_shogun_requires_public_arbitration_reform_tt:0 "需要完成维新改革§Y公仪裁断§!。"
 mf_shogun_requires_domain_transfer_reform_tt:0 "需要完成维新改革§Y国替令§!。"
 mf_shogun_requires_inspection_reform_tt:0 "需要完成维新改革§Y诸藩监察§!。"
 mf_shogun_requires_learning_reform_tt:0 "需要完成维新改革§Y征讨虾夷§!。"
 mf_shogun_requires_sakoku_policy_tt:0 "需要完成维新改革§Y闭关锁国§!。"
 mf_shogun_requires_sankin_reform_tt:0 "需要完成维新改革§Y参勤交代§!。"
 mf_shogun_requires_fudai_reform_tt:0 "需要完成维新改革§Y谱代大名§!。"
 mf_shogun_requires_bakuryo_cadastral_survey_tt:0 "需要完成维新改革§Y幕领检地§!，并已经指定天皇。"
 mf_shogun_requires_private_barrier_reform_tt:0 "需要完成维新改革§Y废除私关§!。"
 mf_shogun_requires_late_reforms_tt:0 "需要完成维新改革§Y征讨虾夷§!、§Y公仪裁断§!、§Y国替令§!和§Y诸藩监察§!。"
 mf_shogun_requires_buke_law_mission_tt:0 "需要完成任务§Y编定武家法度§!。"
 mf_shogun_requires_house_rolls_mission_tt:0 "需要完成任务§Y整理大名名册§!。"
 mf_shogun_requires_court_arbitration_mission_tt:0 "需要完成任务§Y公仪裁断§!。"
 mf_shogun_requires_ezo_target_tt:0 "需要先通过§Y狩野虾夷§!指定虾夷征讨目标。"
 mf_shogun_requires_excommunication_used_tt:0 "需要至少对一个拒命大名执行过§Y绝罚大名§!。"
 mf_shogunate_order_authority_lecture_tt:0 "幕府需要至少§Y5§!点御统；完成任务§Y稳定社会秩序§!后只需要§Y3§!点御统。"
 mf_shogun_unlock_lecture_grace_tt:0 "解锁外交行动§Y训诫大名§!和§Y赦免大名§!。两项行动最初花费§Y5§!御统；完成任务§Y稳定社会秩序§!后降低为§Y3§!御统。"
 mf_shogun_unlock_law_orders_tt:0 "解锁外交行动§Y要求归还领地§!和§Y强制和平§!。\n§Y要求归还领地§!：目标接受时获得§G2§!御统；完成§Y恢复旧家秩序§!后提高为§G5§!御统。目标拒绝时失去§R2§!御统，并获得相应战争理由。\n§Y强制和平§!：最初花费§Y10§!御统；完成§Y制止大名战争§!后降低为§Y5§!御统。"
 mf_shogun_unlock_arbitration_orders_tt:0 "解锁幕府外交行动：§Y强制分割§!、§Y任命执行国§!。\n§Y强制分割§!：目标接受时消耗§Y25§!御统；完成§Y公仪裁断§!后降为§Y15§!。\n§Y任命执行国§!：基础消耗§Y20§!御统；完成§Y国替令§!后降为§Y10§!。目标拒绝时，幕府获得对应战争借口。"
 mf_shogun_abolish_private_barriers_title:0 "废除私关"
 mf_shogun_abolish_private_barriers_desc:0 "各大名设置的关卡阻碍了道路运输和国内贸易。幕府应当废除这些私人关卡，建立统一的市场。"
 mf_shogun_abolish_private_barriers_tt:0 "幕府将逐步控制国内道路和贸易。"
 mf_shogun_reaffirm_kubou_title:0 "重建幕府权威"
 mf_shogun_reaffirm_kubou_desc:0 "稳定的政府、足够的合法性和御统，以及众多直属大名，是幕府维持全国统治的基础。"
 mf_shogun_house_rolls_title:0 "整理大名名册"
 mf_shogun_house_rolls_desc:0 "幕府将登记各大名的地位和从属关系。完善的名册可以帮助将军管理、训诫或赦免地方领主。"
 mf_shogun_buke_relief_after_sakoku_title:0 "安抚武士阶层"
 mf_shogun_buke_relief_after_sakoku_desc:0 "闭关政策影响了武士的收入和地位。幕府将扩大武士兵团的规模，但也需要承担更高的补员费用。"
 mf_shogun_four_estates_peace_title:0 "稳定社会秩序"
 mf_shogun_four_estates_peace_desc:0 "明确的身份制度和稳定的国内政策，使各阶层与地方大名更加服从幕府。"
 mf_shogun_four_estates_peace_tt:0 "§Y训诫大名§!与§Y赦免大名§!的御统消耗降为§Y3§!。"
 mf_shogun_restore_court_channel_title:0 "禁中并公"
 mf_shogun_restore_court_channel_desc:0 "幕府将规范朝廷礼仪与任官制度，重新建立将军与朝廷之间的正式联系。"
 mf_shogun_court_arbitration_title:0 "公仪裁断"
 mf_shogun_court_arbitration_desc:0 "建立朝廷联系、完善大名名册并制定武家法令后，幕府将统一裁决大名之间的争端。"
 mf_shogun_imperial_excommunication_title:0 "绝罚拒命大名"
 mf_shogun_imperial_excommunication_desc:0 "借助天皇的名义，幕府可以绝罚严重违抗命令的大名，并对其发动讨伐。"
 mf_shogun_excommunication_system_tt:0 "解锁幕府外交行动：§Y绝罚大名§!。\n§Y绝罚大名§!会使目标失去§R100§!威望，获得§Y10§!年外交声誉惩罚，并给予幕府绝罚战争借口。"
 mf_shogun_kuge_buke_legal_order_title:0 "朝廷与幕府"
 mf_shogun_kuge_buke_legal_order_desc:0 "朝廷权威与武家法令相互支持，使幕府的裁决得到全国更广泛的认可。"
 mf_shogun_kuge_buke_legal_order_tt:0 "幕府的裁决将获得更高认可。"
 mf_shogun_codify_buke_law_title:0 "编定武家法度"
 mf_shogun_codify_buke_law_desc:0 "幕府将编定各大名共同遵守的武家诸法，并以此要求大名归还领地或停止战争。"
 mf_shogun_enforce_peace_order_title:0 "制止大名战争"
 mf_shogun_enforce_peace_order_desc:0 "幕府应当依据武家诸法制止大名之间的战争，维持国内和平。"
 mf_shogun_executor_system_title:0 "确立执行国"
 mf_shogun_executor_system_desc:0 "执行国协助将军监督各地大名，并确保幕府命令在地方得到执行。"
 mf_shogun_one_lord_one_master_title:0 "一国一主"
 mf_shogun_one_lord_one_master_desc:0 "幕府将规范地方属国关系。大名可以保有合法家臣，其他非法属国则改为将军直属大名。"
 mf_shogun_one_lord_one_master_tt:0 "非法属国将改为将军直属大名，并提高监察收益。"
 mf_shogun_bakuryo_cadastral_survey_title:0 "幕领检地"
 mf_shogun_bakuryo_cadastral_survey_desc:0 "幕府将统一登记日本各地的土地，并以这些记录为依据主张对全国的统治权。"
 mf_shogun_bakuryo_claims_tt:0 "获得日本地区永久宣称。"
 mf_shogun_recover_old_houses_title:0 "恢复旧家秩序"
 mf_shogun_recover_old_houses_desc:0 "恢复被吞并的大名国家可以限制强藩扩张，并维持幕府内部的势力平衡。"
 mf_shogun_transfer_domains_title:0 "推行国替"
 mf_shogun_transfer_domains_desc:0 "通过国替制度，幕府可以重新安排大名领地，削弱对将军构成威胁的地方势力。"
 mf_shogun_fudai_central_council_title:0 "谱代中枢"
 mf_shogun_fudai_central_council_desc:0 "谱代大名协助将军处理政务。任命足够的谱代大名后，幕府可以进一步扩大谱代名额。"
 mf_shogun_fudai_cap_5_tt:0 "§Y指定谱代大名§!上限提高到§Y5§!。"
 mf_shogun_inspection_network_title:0 "诸藩监察网"
 mf_shogun_inspection_network_desc:0 "目付、巡见使和执行国共同监督各地大名，使幕府能够更早发现违令和私人战争。"
 mf_shogun_ordered_realm_title:0 "巩固幕府统治"
 mf_shogun_ordered_realm_desc:0 "幕府改革已经建立完整制度，各地大名仍然承认将军的裁决。"
 mf_shogun_school_of_order_title:0 "本土安定"
 mf_shogun_school_of_order_desc:0 "北海道以外的日本本土已经得到控制，各大名的军队可以转向北方征讨。"
 mf_shogun_ezo_campaign_title:0 "定虾夷征讨"
 mf_shogun_ezo_campaign_desc:0 "幕府已经指定虾夷征讨目标。将军和各大名将共同准备北方战争。"
 mf_shogun_pacify_ezo_title:0 "平定虾夷"
 mf_shogun_pacify_ezo_desc:0 "北海道已经加入幕府体系。北方征讨为幕府带来了军事与外交经验，也为进一步扩张奠定基础。"
 mf_shogun_ezo_scope_expanded_tt:0 "§Y狩野虾夷§!现在可指定更多体系外边境国家。"
 mf_shogun_subdue_ryukyu_title:0 "控制琉球"
 mf_shogun_subdue_ryukyu_desc:0 "琉球位于日本南方的重要航线上。幕府应通过直接统治、属国、同盟或友好关系扩大对当地的影响。"
 mf_shogun_ryukyu_claims_tt:0 "获得琉球方向永久宣称。"
 mf_shogun_korean_campaign_title:0 "影响朝鲜"
 mf_shogun_korean_campaign_desc:0 "幕府应当在朝鲜建立稳定影响，使各大名的军队和日本商人获得通往大陆的机会。"
 mf_shogun_korea_claims_tt:0 "获得朝鲜地区永久宣称。"
 mf_shogun_china_campaign_title:0 "挑战天朝"
 mf_shogun_china_campaign_desc:0 "幕府的力量已经越过大海，现在可以在东亚大陆挑战天朝的地位。"
 mf_mission_kubou_order:0 "幕府权威"
 desc_mf_mission_kubou_order:0 "将军重新证明了幕府有能力维持全国秩序。"
 mf_mission_daimyo_rolls:0 "大名名册"
 desc_mf_mission_daimyo_rolls:0 "各大名的地位和从属关系已经记录在册，使幕府更容易管理地方领主。"
 mf_mission_samurai_relief:0 "安抚武士"
 desc_mf_mission_samurai_relief:0 "幕府扩大了武士兵团的规模，但也需要承担更高的补员费用。"
 mf_mission_four_estates_peace:0 "社会稳定"
 desc_mf_mission_four_estates_peace:0 "明确的身份制度和闭关政策减少了地方动乱与大名的独立倾向。"
 mf_mission_court_channel:0 "朝廷通道"
 desc_mf_mission_court_channel:0 "幕府重新规范了与朝廷有关的礼仪和任官制度。"
 mf_mission_court_arbitration:0 "公仪裁断"
 desc_mf_mission_court_arbitration:0 "幕府统一处理大名之间的争端，使将军的命令成为稳定制度。"
 mf_mission_buke_law:0 "武家法度"
 desc_mf_mission_buke_law:0 "武家诸法已经成为各大名共同遵守的幕府法令。"
 mf_mission_private_war_settlement:0 "私战止息"
 desc_mf_mission_private_war_settlement:0 "幕府制止了大名之间的战争，武家诸法也因此获得了实际威信。"
 mf_mission_executor_system:0 "执行国制度"
 desc_mf_mission_executor_system:0 "幕府已经建立执行国制度，确保将军的命令能够在地方得到执行。"
 mf_mission_old_houses:0 "旧家秩序"
 desc_mf_mission_old_houses:0 "一批被吞并的大名国家得到恢复，地方势力重新回到幕府控制之下。"
 mf_mission_domain_transfer:0 "国替秩序"
 desc_mf_mission_domain_transfer:0 "国替令削弱了大名长期控制同一地区的基础，使幕府能够重新安排危险的地方势力。"
 mf_mission_inspection_network:0 "诸藩监察网"
 desc_mf_mission_inspection_network:0 "目付、巡见使和执行国共同监督诸藩。"
 mf_mission_ordered_realm:0 "幕府统治"
 desc_mf_mission_ordered_realm:0 "各地大名承认将军的裁决，幕府统治已经得到巩固。"
 mf_mission_school_of_order:0 "本土安定"
 desc_mf_mission_school_of_order:0 "北海道以外的日本本土已经稳定，各大名的军队可以转向北方。"
 mf_mission_ezo_campaign:0 "虾夷征讨"
 desc_mf_mission_ezo_campaign:0 "幕府已经指定虾夷征讨目标，各大名可以在北方战争中积累经验。"
 mf_mission_ezo_pacification:0 "平定虾夷"
 desc_mf_mission_ezo_pacification:0 "北海道加入幕府体系后，北方征讨的经验提高了幕府的军事与外交威望。"
 mf_mission_ryukyu_outreach:0 "琉球通路"
 desc_mf_mission_ryukyu_outreach:0 "幕府加强了与琉球之间的海上联系，提高了贸易和海军能力。"
 mf_mission_korea_campaign:0 "朝鲜方向"
 desc_mf_mission_korea_campaign:0 "幕府已经在朝鲜建立稳定影响，为贸易与对外战争提供了新的方向。"
 mf_mission_china_order:0 "挑战天朝"
 desc_mf_mission_china_order:0 "幕府已经证明自己有能力把影响扩展到东亚大陆。"
