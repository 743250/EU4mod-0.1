l_english:
 mf_TKG_ideas:0 "德川理念"
 mf_TKG_ideas_start:0 "德川传统"
 mf_TKG_ideas_bonus:0 "德川野望"
 mf_tkg_mikawa_bushi:0 "三河武士"
 mf_tkg_mikawa_bushi_desc:0 "三河土地贫瘠，又长期处于战争前线。这里的武士习惯了艰苦生活和频繁作战，以坚韧和忠诚闻名，是德川军队最可靠的核心。"
 mf_tkg_strengthen_the_sekisho_network:0 "完善关所网络"
 mf_tkg_strengthen_the_sekisho_network_desc:0 "街道和关所不仅检查来往人员与货物，也能收集各地消息。完善这套网络后，邻国的军事调动将很难逃过我们的注意。"
 mf_tkg_hatamoto:0 "旗本众"
 mf_tkg_hatamoto_desc:0 "旗本是直接效忠主君的武士。他们既是战场上的精锐，也是维护德川家统治的重要力量。严格的军纪和世代相传的忠诚，使旗本成为军队的核心。"
 mf_tkg_metsuke:0 "目付巡察"
 mf_tkg_metsuke_desc:0 "目付负责监督家臣和地方领地，检查军役、法令和行政。稳定的监察制度可以减少腐败，也能让支藩和重臣更加服从德川家。"
 mf_tkg_matsudaira_branches:0 "松平诸家"
 mf_tkg_matsudaira_branches_desc:0 "松平一族分布在三河各地，与谱代家臣共同构成德川家的统治基础。让亲族镇守要地和新征服的领土，可以帮助当地更快恢复稳定。"
 mf_tkg_toshogu:0 "东照大权现"
 mf_tkg_toshogu_desc:0 "德川家将祖先供奉在东照宫，并尊其为保护国家的神明。庄严的祭祀和遍布各地的信仰，使德川政权获得了神圣威望。"
 mf_tkg_famine_policies:0 "饥荒对策"
 mf_tkg_famine_policies_desc:0 "政府在丰收年份储备粮食，在灾荒时救济百姓，同时整修水利并及时调查灾情。充足的粮仓和有效的救济可以防止饥荒破坏地方秩序。"
