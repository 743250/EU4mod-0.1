l_english:
 mf_ai_complete_shogunate_transfer_title:0 "接管幕府"
 mf_ai_complete_shogunate_transfer_desc:0 "新任将军已经控制京都，现在应当正式接管幕府，并重新确认各大名的从属关系。"
 mf_register_shogunate_provinces_title:0 "登记幕府领地"
 mf_register_shogunate_provinces_desc:0 "幕府将登记自己和直属大名控制的省份。今后这些领地即使被其他国家夺走，幕府仍可要求归还。"
 mf_ai_xuanxiafengxing_title:0 "指定天皇"
 mf_ai_xuanxiafengxing_desc:0 "幕府需要指定一位天皇，作为朝廷和日本传统秩序的代表。"
 mf_ai_shouyexiayi_title:0 "指定虾夷征讨目标"
 mf_ai_shouyexiayi_desc:0 "幕府将选择一个边境国家作为虾夷征讨目标，组织各大名共同对外作战。"
 mf_ai_shogun_yuling_title:0 "颁布幕府御令"
 mf_ai_shogun_yuling_desc:0 "幕府将根据当前局势颁布一项御令，在未来十年内推行相应政策。"
 mf_ai_shogun_weixin_b_title:0 "推行幕领检地"
 mf_ai_shogun_weixin_b_desc:0 "幕府将重新登记日本各地的领地，建立统一的土地记录。"
 mf_ai_shogun_weixin_c_title:0 "推行身份统制"
 mf_ai_shogun_weixin_c_desc:0 "幕府将整顿大名、家臣和各阶层之间的身份与从属关系。"
 mf_ai_shogun_weixin_d_title:0 "推行禁中并公"
 mf_ai_shogun_weixin_d_desc:0 "幕府将整顿朝廷礼仪和任官制度，让朝廷与武家政权建立更稳定的合作关系。"
 mf_ai_shogun_weixin_e_title:0 "建立谱代大名制度"
 mf_ai_shogun_weixin_e_desc:0 "幕府将任用可信的大名参与政务，并让他们承担更多军役。"
 mf_ai_shogun_weixin_i_title:0 "组织虾夷征讨"
 mf_ai_shogun_weixin_i_desc:0 "幕府将建立长期的北方征讨制度，把各大名的军力用于共同的对外战争。"
 mf_ai_shogun_weixin_h_title:0 "确立参勤交代"
 mf_ai_shogun_weixin_h_desc:0 "幕府将要求各大名定期前往幕府参勤，以便将军监督地方领主。"
 mf_ai_shogun_weixin_j_title:0 "确立公仪裁断"
 mf_ai_shogun_weixin_j_desc:0 "幕府将负责裁决大名之间的争端，使将军的命令成为全国通行的规则。"
 mf_ai_shogun_weixin_k_title:0 "颁布国替令"
 mf_ai_shogun_weixin_k_desc:0 "幕府将确立转封大名的权力，防止地方势力长期控制同一片领地。"
 mf_ai_shogun_weixin_l_title:0 "建立诸藩监察"
 mf_ai_shogun_weixin_l_desc:0 "幕府将派遣目付与巡见使监督各大名，及时发现违令、私战和领地兼并。"
 mf_ai_shogun_weixin_f_title:0 "编定武家诸法"
 mf_ai_shogun_weixin_f_desc:0 "幕府将制定各大名共同遵守的法令，全面禁止幕府体系内的私人战争。"
 mf_ai_shogun_weixin_g_title:0 "推行闭关锁国"
 mf_ai_shogun_weixin_g_desc:0 "幕府将限制海外贸易、渡航和外来宗教，以加强对国内社会的控制。"
