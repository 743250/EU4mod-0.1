l_english:
 mf_daimyo.10.b.tt:0 "拒绝本年度参勤：获得§G10§!威望和持续一年的§Y拒绝参勤交代§!，幕府御统§R-0.5§!。本次拒绝不会产生讨伐理由或后续强制参勤。"
 shogun_weixin.h.a.tt:0 "参勤交代由临时御令升为常法，年度参勤事件到此结束。\n\n幕府获得：\n属国发展度造成的独立倾向：§G-20%§!\n\n幕府体系大名不能再互相结盟，改革前已有的大名同盟将被解除。"
 mf_excommunicate_daimyo_desc:0 "完成禁中并公并拥有天皇目标后，幕府可以对拒绝归还领地、强制和平、分割或执行国任命的大名施加绝罚。绝罚会降低目标威望、外交声誉和稳定，并给予幕府讨伐理由。"
